apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        args: []
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: patchworks-manager-secret
              key: REDIS_PASSWORD
        - name: REDIS_USERNAME
          valueFrom:
            secretKeyRef:
              name: patchworks-manager-secret
              key: REDIS_USERNAME
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: redis-config
          mountPath: /redis-master
      volumes:
      - name: redis-config
        configMap:
           name: redis-config
      - name: data
        persistentVolumeClaim:
          claimName: redis-data-pvc
